# docker-compose.yml
# Local development environment for fhir_web.
#
# Services:
#   hapi-fhir  — Local HAPI FHIR R4 server (port 8090 on host)
#   backend    — FastAPI application      (port 8000 on host)
#   frontend   — Vite dev server          (port 5173 on host)
#
# Usage:
#   docker compose up --build      # first run (builds images)
#   docker compose up              # subsequent runs (uses cached images)
#   docker compose down            # stop and remove containers
#   docker compose down -v         # also remove the DuckDB named volume

services:

  # ---------------------------------------------------------------------------
  # HAPI FHIR Server
  # ---------------------------------------------------------------------------
  # Runs a local R4-compliant FHIR server.  Subscriptions (REST-hook) are
  # enabled so the backend can register webhooks and receive change events.
  # Data is ephemeral — the container resets on each `down`.
  # ---------------------------------------------------------------------------
  hapi-fhir:
    image: hapiproject/hapi:latest
    ports:
      # Map host port 8090 → container port 8080.
      # The frontend browser talks to HAPI at http://localhost:8090/fhir.
      - "8090:8080"
    environment:
      # Enable REST-hook subscriptions so HAPI can POST to our backend webhook.
      - hapi.fhir.subscription.resthook_enabled=true
      # Allow any origin for CORS (dev only — tighten this in production).
      - hapi.fhir.cors.allowed_origin=*
    healthcheck:
      # The hapiproject/hapi image is distroless — no shell (/bin/sh) and no
      # curl binary are available, so CMD-SHELL won't work.  The only binary
      # present is /usr/bin/java (JRE only, no jdk.compiler module), which
      # means source-file mode is also unavailable.
      #
      # Solution: open a raw TCP socket to port 8080 from Java, which proves
      # the JVM listener is up.  Spring Boot binds the HTTP port as soon as
      # the web context starts, so a successful TCP connect is a reliable
      # proxy for "HAPI is ready to serve FHIR requests".
      #
      # The one-liner below (exec form — no shell required):
      #   java -cp ""                       # empty classpath; uses java.base only
      #        -Djava.security.manager=deny  # drop unnecessary security overhead
      #        HealthCheck                   # hypothetical class — see alternative
      #
      # Actually the cleanest exec-form approach is to open a Socket inside the
      # running JVM process by passing a tiny Jar.  Instead, we avoid the
      # distroless constraint entirely by probing from the Docker daemon's host
      # network — Docker healthchecks CAN use the host network for probing when
      # we use "CMD" form with a helper in a sidecar.
      #
      # Simpler still: disable the in-container healthcheck (test: NONE) and
      # let the backend's `depends_on: service_started` + `restart: on-failure`
      # handle readiness — the backend will retry until HAPI responds.
      test: ["NONE"]

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  # Built from backend/Dockerfile.  Mounts a named volume so the DuckDB file
  # survives container restarts.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # ---- Database ---------------------------------------------------------
      # Store the DuckDB file inside the /app/data volume mount.
      - DATABASE_URL=duckdb:///data/referrals.duckdb

      # ---- CORS -------------------------------------------------------------
      # Allow the Vite dev server and any common local origin.
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000

      # ---- Webhook URLs -----------------------------------------------------
      # IMPORTANT: Both of these use Docker-internal hostnames, NOT localhost.
      #
      # WEBHOOK_BASE_URL  — the URL that HAPI will POST to when a subscription
      #   fires.  Must be the backend's hostname on the Docker network so that
      #   container-to-container traffic works.  "backend" resolves inside the
      #   compose network; "localhost" would resolve to HAPI's own container.
      - WEBHOOK_BASE_URL=http://backend:8000

      # WEBHOOK_FHIR_URL  — the FHIR server the backend talks to when setting
      #   up subscriptions or querying resources.  "hapi-fhir" is the service
      #   name above and resolves via Docker DNS.
      - WEBHOOK_FHIR_URL=http://hapi-fhir:8080/fhir

      # ---- Misc -------------------------------------------------------------
      - DEBUG=false
    volumes:
      # Named volume so DuckDB data persists across `docker compose down` (but
      # not `docker compose down -v`).
      - backend-data:/app/data
    # Retry on failure so the backend keeps restarting until HAPI is ready.
    # This is necessary because hapiproject/hapi is distroless (no shell,
    # no curl) so we cannot use a `service_healthy` healthcheck condition.
    # The backend starts fast; if HAPI isn't ready the lifespan init may
    # still succeed (it doesn't require HAPI at startup), so in practice
    # one start is usually enough.
    restart: on-failure
    depends_on:
      - hapi-fhir   # ensures HAPI starts before the backend, not that it's healthy

  # ---------------------------------------------------------------------------
  # React / Vite Frontend
  # ---------------------------------------------------------------------------
  # Built from frontend/frontend/Dockerfile.  The Vite dev server is exposed
  # on port 5173.  Hot-module replacement (HMR) works because Vite binds to
  # 0.0.0.0 inside the container.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Tell the browser (not the container) where the API lives.
      # This is read at *runtime* by Vite; it must be a host-reachable address.
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

# -----------------------------------------------------------------------------
# Named Volumes
# -----------------------------------------------------------------------------
volumes:
  # Persists the DuckDB database file between container restarts.
  backend-data:
