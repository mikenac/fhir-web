[project]
name = "fhir-web-backend"
version = "0.1.0"
description = "FHIR web application backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
    "pyjwt==2.11.0",
    "cryptography==44.0.0",
    "python-fhir-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
python-fhir-client = { git = "https://github.com/mikenac/python-fhir-client.git", branch = "main" }
